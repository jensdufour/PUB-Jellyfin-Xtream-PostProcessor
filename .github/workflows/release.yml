name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: |
          dotnet restore Jellyfin.Plugin.XtreamPostProcessor.sln
          dotnet build Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-restore
          dotnet test Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-build
      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match project version' }
          $package = ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') | ConvertFrom-Json
          "$($package.SHA256)  $([IO.Path]::GetFileName($package.Archive))" | Set-Content "$($package.Archive).sha256"
          "archive=$($package.Archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.Checksum)" >> $env:GITHUB_OUTPUT
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --generate-notes --verify-tag
      - name: Update catalog manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog fetch failed' }
          git switch main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog checkout failed' }
          git merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog update is not fast-forward' }
          ./scripts/update-manifest.ps1 `
            -Version $env:GITHUB_REF_NAME.TrimStart('v') `
            -Checksum '${{ steps.package.outputs.checksum }}' `
            -Timestamp (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          git commit -m "Update catalog for $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Catalog commit failed' }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw 'Catalog push failed' }
          gh api "repos/$env:GITHUB_REPOSITORY/pages/builds" --method POST
          if ($LASTEXITCODE -ne 0) { throw 'Catalog Pages build request failed' }
