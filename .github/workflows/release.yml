name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        run: |
          dotnet restore Jellyfin.Plugin.XtreamPostProcessor.sln
          dotnet build Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-restore
          dotnet test Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-build
      - name: Package
        id: package
        shell: pwsh
        run: |
          $package = ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') | ConvertFrom-Json
          "archive=$($package.Archive)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.Checksum)" >> $env:GITHUB_OUTPUT
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" --generate-notes --verify-tag
      - name: Update catalog manifest
        shell: pwsh
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          ./scripts/update-manifest.ps1 `
            -Version $env:GITHUB_REF_NAME.TrimStart('v') `
            -Checksum '${{ steps.package.outputs.checksum }}' `
            -Timestamp (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update catalog for $env:GITHUB_REF_NAME"
            git push origin main
          }
