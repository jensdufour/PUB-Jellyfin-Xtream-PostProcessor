name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        run: |
          dotnet restore Jellyfin.Plugin.XtreamPostProcessor.sln
          dotnet build Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-restore
          dotnet test Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-build
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag
