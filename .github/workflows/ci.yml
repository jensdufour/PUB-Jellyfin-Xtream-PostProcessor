name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore Jellyfin.Plugin.XtreamPostProcessor.sln
      - run: dotnet build Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-restore
      - run: dotnet test Jellyfin.Plugin.XtreamPostProcessor.sln --configuration Release --no-build
